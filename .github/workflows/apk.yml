# APK Production Workflow — Cricket Game
# Explicit manual trigger (workflow_dispatch) produces a signed debug APK.
# CI (build + test on every push) is handled separately in ci.yml.
#
# APK is uploaded as a GitHub Actions artifact with commit SHA in the filename.
# Previous versions are retained for rollback (30-day retention).
# All GitHub Actions are pinned to commit SHAs for supply chain security.

name: Build APK

on:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get short commit SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: ./gradlew assembleDebug -PversionNameSuffix=${{ steps.sha.outputs.short }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cricket-game-debug-${{ steps.sha.outputs.short }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
